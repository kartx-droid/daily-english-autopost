<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Baloo 2"; src: url("{{FONT_URL}}") format("truetype"); font-weight: 400 800; font-display: block; }
  :root {
    --accent: {{ACCENT}};
    --accent-dark: {{ACCENT_DARK}};
    --ink: #13213F;
    --hi: #B42318;
    --pron: #E0403A;
    --paper: #FFFBF2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: var(--paper);
    font-family: "Baloo 2", "Noto Sans Devanagari", "Nirmala UI", sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--accent);
    color: #fff;
    padding: 40px 64px 48px;
    border-radius: 0 0 56px 56px;
    position: relative;
    text-align: center;
  }
  h1 {
    font-size: 84px; font-weight: 800; line-height: 1.15;
    margin-top: 18px;
    white-space: nowrap; overflow: hidden;
  }
  .sub {
    display: inline-block; margin-top: 10px;
    background: #fff; color: var(--accent-dark);
    font-size: 36px; font-weight: 700;
    padding: 2px 30px; border-radius: 999px;
  }

  header { flex: none; }
  main { flex: 1; min-height: 0; padding: 28px 60px 22px; display: flex; }
  .list { list-style: none; width: 100%; display: flex; flex-direction: column; justify-content: space-evenly; }

  .row {
    display: flex; align-items: center; gap: 18px;
    font-size: 50px; font-weight: 700; line-height: 1.2;
    white-space: nowrap;
    border-bottom: 3px dashed #EADFC8;
    padding-bottom: 6px;
  }
  .row:last-child { border-bottom: none; }
  .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); flex: none; }
  .row .hi { color: var(--hi); width: 36%; flex: none; overflow: hidden; text-overflow: clip; }
  .arrow { color: var(--accent-dark); flex: none; }
  .row .en { color: var(--ink); flex: 1; overflow: hidden; }
  .pron { color: var(--pron); font-weight: 600; font-size: .82em; }

  .card {
    background: #fff;
    border-left: 14px solid var(--accent);
    border-radius: 22px;
    padding: 8px 28px 6px;
    box-shadow: 0 4px 0 #EADFC8;
  }
  .shi { font-size: 34px; font-weight: 600; color: var(--hi); line-height: 1.2; white-space: nowrap; overflow: hidden; }
  .sen { font-size: 37px; font-weight: 700; color: var(--ink); line-height: 1.2; white-space: nowrap; overflow: hidden; }

  /* Quiz item: the last word/sentence, with its English hidden. */
  .quiz {
    position: relative;
    background: #FFF1B8;
    border: 4px dashed var(--accent-dark);
    border-radius: 22px;
    padding: 14px 20px 8px;
    margin-top: 14px;
  }
  .row.quiz { border-bottom: 4px dashed var(--accent-dark); }
  .card.quiz { border-left-width: 14px; border-left-style: solid; border-left-color: var(--accent); box-shadow: none; }
  .badge {
    position: absolute; top: -22px; right: 22px;
    background: var(--accent-dark); color: #fff;
    font-size: 24px; font-weight: 700; line-height: 1.5;
    padding: 0 18px; border-radius: 999px;
  }
  .hint { color: var(--accent-dark); white-space: pre; letter-spacing: 1px; }
  .sen.ask { color: var(--accent-dark); }

  footer {
    flex: none;
    background: var(--ink); color: #fff;
    height: 118px; padding: 0 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    width: 86px; height: 86px; border-radius: 50%;
    background: #000; border: 3px solid #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; line-height: 1.05; text-align: center;
  }
  .logo i { font-style: normal; display: block; width: 46px; height: 3px; background: var(--accent); margin: 2px 0; }
  .handle { font-size: 40px; font-weight: 700; }
  .cta { font-size: 30px; font-weight: 600; color: #FFD166; }
</style>
</head>
<body>
  <header>
    <h1>{{TITLE_HI}}</h1>
    <span class="sub">{{TITLE_EN}}</span>
  </header>
  <main>{{BODY}}</main>
  <footer>
    <div class="logo">Daily<br>English<i></i>line</div>
    <div class="handle">{{HANDLE}}</div>
    <div class="cta">Answer Comment करें</div>
  </footer>
<script>
  // Shrink any line that doesn't fit its box, after web fonts have loaded.
  window.fit = async function () {
    await document.fonts.ready;
    const shrink = (el, min) => {
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth && size > min) {
        size -= 1;
        el.style.fontSize = size + "px";
      }
    };
    document.querySelectorAll(".row").forEach(row => {
      shrink(row.querySelector(".hi"), 30);
      shrink(row.querySelector(".en"), 28);
    });
    document.querySelectorAll(".shi, .sen").forEach(el => shrink(el, 24));
    shrink(document.querySelector("h1"), 48);
  };
</script>
</body>
</html>
