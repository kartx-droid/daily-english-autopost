name: Daily Instagram post

on:
  schedule:
    - cron: "30 7 * * *"  # 07:30 UTC = 1:00 PM IST -> Reel
    - cron: "30 13 * * *" # 13:30 UTC = 7:00 PM IST -> Carousel (each post takes the next unused topic)
  workflow_dispatch:
    inputs:
      format:
        description: "Kya banana hai"
        type: choice
        options: [carousel, reel, image]
        default: carousel
      dry_run:
        description: "Sirf media banao (Instagram par post mat karo)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    # Pinned: ubuntu-latest moved to Ubuntu 26, where installing Playwright's browser failed.
    runs-on: ubuntu-24.04
    env:
      # Scheduled runs have no inputs, so they always post for real.
      DRY_RUN: ${{ inputs.dry_run == true }}
      FORMAT: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 7 * * *' && 'reel' || 'carousel') || inputs.format }}
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No apt-get and no browser download: the runner's preinstalled Google Chrome renders the
      # pages and the font ships in template/fonts. (The apt/browser install failed on 11 Nov.)
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Check Instagram token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/autopost.py check

      - name: Render today's ${{ env.FORMAT }}
        id: render
        run: python scripts/autopost.py render --format "$FORMAT" ${{ github.event_name == 'schedule' && '--once-per-day' || '' }}

      - name: Upload preview
        if: steps.render.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: preview-${{ env.FORMAT }}
          path: |
            ${{ steps.render.outputs.dir }}/*.jpg
            ${{ steps.render.outputs.dir }}/*.mp4

      - name: Commit images (Instagram needs public URLs)
        if: env.DRY_RUN != 'true' && steps.render.outputs.skip != 'true' && env.FORMAT != 'reel'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.render.outputs.dir }}"
          # A retry after a failed publish may re-render identical images.
          git diff --cached --quiet || git commit -m "Images for post $(( ${{ steps.render.outputs.index }} + 1 ))"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        if: env.DRY_RUN != 'true' && steps.render.outputs.skip != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          sleep 10
          python scripts/autopost.py publish --manifest "${{ steps.render.outputs.manifest }}" \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.commit.outputs.sha }}"

      - name: Save progress
        if: env.DRY_RUN != 'true' && steps.render.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Posted ${FORMAT} for post $(( ${{ steps.render.outputs.index }} + 1 ))"
          git pull --rebase -q
          git push

      # Only "Instagram login" (IG...) tokens expire; system-user tokens are skipped by the script.
      # Needs a GH_PAT secret allowed to write this repo's secrets.
      - name: Refresh Instagram token
        if: env.DRY_RUN != 'true' && env.HAS_PAT == 'true'
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python scripts/autopost.py refresh --out "$RUNNER_TEMP/ig_token"
          if [ -s "$RUNNER_TEMP/ig_token" ]; then
            gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < "$RUNNER_TEMP/ig_token"
          fi
          rm -f "$RUNNER_TEMP/ig_token"
